[project]
name = "beauty-inspector"
version = "0.1.0"
description = "Telegram-first service for collecting and reporting salon information"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4",
  "beautifulsoup4>=4.13,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
